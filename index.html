<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Type your options, shake your phone, get a random pick.">
  <meta name="theme-color" content="#2335C8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ShakePick">
  <title>ShakePick</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-512.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">

    <header class="top">
      <h1 class="brand">ShakePick</h1>
      <span class="count" id="count">0 items</span>
    </header>

    <!-- Result area: the ticket shows the picked item -->
    <section class="stage" aria-label="Result">
      <div class="ticket" id="ticket">
        <p class="ticket-text" id="result" aria-live="polite">Add a few items, then shake</p>
      </div>
      <p class="hint" id="hint">Shake your phone or tap Pick</p>
      <div class="stage-actions">
        <button class="btn-pick" id="pickBtn" type="button">Pick</button>
        <button class="btn-allow" id="allowBtn" type="button" hidden>Allow shake</button>
      </div>
    </section>

    <!-- Item list -->
    <section class="panel" aria-label="Your items">
      <form class="add" id="addForm" autocomplete="off">
        <label class="sr-only" for="itemInput">New item</label>
        <textarea id="itemInput" rows="1" enterkeyhint="done"
          placeholder="Type an item"></textarea>
        <button type="submit" class="btn-add">Add</button>
      </form>
      <p class="tip">Separate several items with commas or new lines.</p>

      <ul class="chips" id="list"></ul>
      <p class="empty" id="empty">Your list is empty. Add names, numbers, food, anything.</p>

      <div class="list-actions">
        <button class="btn-text" id="clearBtn" type="button">Clear all</button>
      </div>
    </section>

    <!-- Settings -->
    <section class="panel options" aria-label="Options">
      <label class="toggle">
        <input type="checkbox" id="optRemove">
        <span>Remove an item after it's picked</span>
      </label>
      <label class="toggle" id="vibrateRow">
        <input type="checkbox" id="optVibrate" checked>
        <span>Vibrate on pick</span>
      </label>
    </section>

    <!-- Last 5 picks -->
    <section class="panel" id="historyBox" aria-label="Recent picks" hidden>
      <h2 class="panel-title">Recent picks</h2>
      <ol class="history" id="history"></ol>
    </section>

  </main>

  <script src="shake.js"></script>
  <script src="app.js"></script>
</body>
</html>
